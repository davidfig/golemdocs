name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The font metrics the layout tests use are committed; the .docx corpus is not. Without it
      # the round-trip and incremental-layout tests skip silently.
      - name: Fetch the .docx test corpus
        run: pnpm --filter @word/docx corpus
      - run: pnpm test
      - name: Coverage
        run: pnpm test:coverage
      - run: pnpm --filter @word/client build
