name: Desktop release

# Builds the desktop app's installers for a release and attaches them to a DRAFT GitHub Release.
# Push the tag (git push origin vX.Y.Z) after the version bump; publish the draft once the installers are checked.
# The Mac app is signed and notarized when the Apple secrets exist (docs/architecture/desktop-release.md);
# without them the build still runs and makes an unsigned one.
# The Windows installers are signed with Azure Artifact Signing; a pushed tag fails without its keys, so nothing unsigned
# is released by accident, while a run from the Actions tab warns and builds unsigned. Linux builds are not code-signed.
# Every build's update files are signed with the Tauri update key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (for example v0.18.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The Tauri command line, from npm without adding it to the workspace (the repository keeps no npm dependency on it).
  TAURI_CLI: '@tauri-apps/cli@2.12.2'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the app's version
        run: |
          want="${TAG#v}"
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          root=$(node -p "require('./package.json').version")
          echo "tag $want, tauri.conf.json $conf, Cargo.toml $cargo, package.json $root"
          [ "$conf" = "$want" ] && [ "$cargo" = "$want" ] && [ "$root" = "$want" ] || { echo "::error::version mismatch: bump every version before tagging"; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: The update signing key exists
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: the update files cannot be signed (docs/architecture/desktop-release.md)"; exit 1; }'

      - name: Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      # macOS signing and notarization. The Apple secrets are handed to the build only when they exist, so a repository
      # without them (or a test run) still makes an unsigned app instead of failing on an empty identity.
      - name: Mac signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple signing secrets are missing: this Mac app will be unsigned and not notarized."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # Windows signing. Tauri reads tauri.windows.conf.json on its own and runs signCommand on the app and on each
      # installer; artifact-signing-cli takes the account and profile from the environment.
      - name: Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            if [ "$TAG_PUSH" = true ]; then echo "::error::A release needs the Artifact Signing secrets and variables (docs/architecture/desktop-release.md)"; exit 1; fi
            echo "::warning::Artifact Signing secrets or variables are missing: this Windows build will be unsigned."
            exit 0
          fi
          cargo install artifact-signing-cli --version 0.12.0 --locked
          {
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"; echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"; echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "AZURE_ARTIFACT_SIGNING_ACCOUNT=$ACCOUNT"; echo "AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE=$PROFILE"
            echo "WINDOWS_SIGNED=1"
          } >> "$GITHUB_ENV"
          printf '{ "bundle": { "windows": { "signCommand": "artifact-signing-cli -e %s -d GolemDocs %%1" } } }\n' "$ENDPOINT" > desktop/src-tauri/tauri.windows.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; the matching public key is in tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          # The release config turns on the signed update files (bundle.createUpdaterArtifacts); it is not in tauri.conf.json
          # because a local `cargo tauri build` has no signing key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          # Our own updater.json (scripts/publish-desktop.ts) points at golemdocs.com, so the action's one for GitHub is not wanted.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          tagName: ${{ env.TAG }}
          releaseName: GolemDocs ${{ env.TAG }}
          releaseBody: See What's New in the app (Help › What's New) for what changed.
          releaseDraft: true
          prerelease: false

      # The app inside each installer is signed by the same signCommand before it is packed.
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGNED == '1'
        shell: bash
        run: |
          for f in desktop/src-tauri/target/release/bundle/nsis/*-setup.exe desktop/src-tauri/target/release/bundle/msi/*.msi; do
            powershell -NoProfile -Command "\$s = Get-AuthenticodeSignature '$f'; \"\$(\$s.Status) \$(\$s.SignerCertificate.Subject) $f\"; if (\$s.Status -ne 'Valid') { exit 1 }"
          done
