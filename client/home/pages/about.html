      <article class="page">
        <div class="row">
          <div class="text">
            <p class="kicker">{{about.kicker}}</p>
            <h1>{{about.h1}}</h1>
          </div>
        </div>

        <div class="row">
          <div class="text"><p>{{about.p1}}</p></div>
          <aside class="balloon"><b>David</b>{{about.b1}}</aside>
        </div>
        <div class="row">
          <div class="text"><p>{{about.p2}}</p></div>
          <aside class="balloon agent"><b>{{about.b2h}}</b>{{about.b2}}</aside>
        </div>
        <div class="row">
          <div class="text"><p>{{about.p3}}</p></div>
        </div>
        <div class="row">
          <div class="text"><p>{{about.p4}}</p></div>
        </div>
        <div class="row">
          <div class="text">
            <h2>{{about.requests.h}}</h2>
            <p>{{about.requests.p1}}</p>
            <p>{{about.requests.p2}}</p>
            <p>{{about.requests.p3}}</p>
          </div>
          <aside class="balloon" style="margin-top: 76px"><b>David</b>{{about.b3}}</aside>
        </div>
        <div class="row">
          <div class="text">
            <p class="sig">David</p>
            <p class="sig-name">{{about.sig}}</p>
          </div>
        </div>
      </article>
