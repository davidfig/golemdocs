<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golem Docs</title>
  </head>
  <body>
    <header id="chrome"></header>
    <main id="viewport">
      <canvas id="canvas"></canvas>
      <textarea id="input" aria-label="Document" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </main>
    <div id="debug">
      <pre id="statusInfo" class="debug-box" hidden></pre>
      <div id="renderInfo" class="debug-box" title="Click to reset the frame times" hidden>
        <div id="fpsRow" hidden><span id="renderLight" title="Lit while the canvas draws"></span><span id="fps"></span></div>
        <pre id="stats"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
