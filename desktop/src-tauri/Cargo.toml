[package]
name = "golemdocs-desktop"
version = "0.19.0"
description = "GolemDocs desktop app: the web app in a native window, with a folder of files kept in sync"
edition = "2021"
publish = false

[lib]
name = "golemdocs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
