[package]
name = "golemdocs-desktop"
version = "0.30.1"
description = "GolemDocs desktop app: the web app in a native window, with a folder of files kept in sync"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "golemdocs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Folder picking and self-update exist on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
